version: 2

models:
  - name: int_market_prices
    description: "Prepare daily market prices observations and calculate reusable security-level performance inputs."

    data_tests:
     - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
            - date
            - ticker
    
    columns:
    - name: date
      description: "The trading date on which the market price and volume data was observed."
      data_tests:
        - not_null

    - name: ticker
      description: "The ticker symbol identifying the security."
      data_tests:
        - not_null
        - accepted_values:
            arguments:
              values:
                - SPY
                - QQQ
                - IWM
                - VTI
                - VXUS
                - VT
                - BND
                - FZROX
                - FZILX
                - FXNAX
                - FBIIX

    - name: open
      description: "The opening market price for the security on the trading date."
      data_tests:
        - not_null

    - name: high
      description: "The highest market price for the security on the trading date."
      data_tests:
        - not_null

    - name: low
      description: "The lowest market price for the security on the trading date."
      data_tests:
        - not_null

    - name: close
      description: "The closing market price for the security on the trading date."
      data_tests:
        - not_null

    - name: adj_close
      description: "The closing market price adjusted for applicable corporate actions."
      data_tests:
        - not_null

    - name: volume
      description: "The total number of shares traded for the security on the trading date."
      data_tests:
        - not_null

    - name: prev_adj_close
      description: "The previous trading day's adjusted closing price for the security. NULL for the first observation of each ticker."

    - name: daily_price_change
      description: "The change in adjusted closing price from the previous trading day. NULL for the first observation of each ticker."

    - name: daily_return
      description: "The simple daily return calculated from the current and previous adjusted closing prices. NULL for the first observation of each ticker."

    - name: log_return
      description: "The natural logirithm of the ratio of the current adjusted closing price to the previous adjusted closing price. NULL for the first observation of each ticker."